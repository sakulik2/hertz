name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消尚在运行的旧任务，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 21：与本地验证过的版本一致。compileOptions 面向 Java 17 字节码，
      # 与运行 Gradle 的 JDK 无关。
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain

      # 无需设备即可验证仪器测试能编译通过
      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain

      # fork 发来的 PR 拿不到 secret，故 PR 上整体跳过；
      # secret 未配置时也只是不产出 store-file，release 退回未签名构建。
      - name: Prepare signing credentials
        id: signing
        if: github.event_name != 'pull_request'
        env:
          HERTZ_KEYSTORE_BASE64: ${{ secrets.HERTZ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HERTZ_KEYSTORE_BASE64" ]; then
            echo "未提供 HERTZ_KEYSTORE_BASE64，release 将构建为未签名包"
            exit 0
          fi
          printf '%s' "$HERTZ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hertz-release.jks"
          echo "store-file=$RUNNER_TEMP/hertz-release.jks" >> "$GITHUB_OUTPUT"

      # 验证 R8 规则有效。未提供密钥时产出未签名包，这是预期行为。
      # 四项缺任意一项，build.gradle.kts 就不注册 signingConfig —— 空字符串会被
      # isNotBlank 过滤掉，所以上一步跳过时这里自然退回未签名。
      - name: Assemble release
        env:
          HERTZ_STORE_FILE: ${{ steps.signing.outputs.store-file }}
          HERTZ_STORE_PASSWORD: ${{ secrets.HERTZ_STORE_PASSWORD }}
          HERTZ_KEY_ALIAS: ${{ secrets.HERTZ_KEY_ALIAS }}
          HERTZ_KEY_PASSWORD: ${{ secrets.HERTZ_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      # 签名静默失效过一次（storeFile 路径被 .properties 转义吃掉分隔符），
      # 所以签过名就断言一次签名者，别只信构建成功
      - name: Verify release signature
        if: steps.signing.outputs.store-file != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      # 密钥材料不留在 runner 上，即便后续步骤失败也要删
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hertz-release.jks"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hertz-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # R8 映射文件是解读 release 崩溃栈的唯一依据，丢了就没法还原
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
