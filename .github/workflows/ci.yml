name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消尚在运行的旧任务，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21：与本地验证过的版本一致。compileOptions 面向 Java 17 字节码，
      # 与运行 Gradle 的 JDK 无关。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain

      # 无需设备即可验证仪器测试能编译通过
      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain

      # 验证 R8 规则有效。未提供密钥时产出未签名包，这是预期行为。
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hertz-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # R8 映射文件是解读 release 崩溃栈的唯一依据，丢了就没法还原
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
